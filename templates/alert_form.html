<!DOCTYPE html>
<html>
<head>
    <title>Price Alerts | Crypto Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Price Alerts</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <div class="container">

        <!-- Alert Form Card -->
        <div class="coin-card" style="max-width:500px; margin:0 auto 40px auto;">
            <h2 style="text-align:center;">Set New Alert</h2>

            <form method="POST">
                <input type="text" name="coin" placeholder="Coin Name (e.g., bitcoin)" required>
                <input type="number" name="target_price" step="any" placeholder="Target Price (USD)" required>
                <button type="submit">Create Alert</button>
            </form>
        </div>

        <!-- Alerts Grid -->
        <h2 style="text-align:center; margin-bottom:20px;">My Alerts</h2>

        <div class="card-grid">
        {% for alert in alerts_data %}
            <div class="coin-card">
                <h3>{{ alert.coin.upper() }}</h3>
                <p>Target Price: ${{ alert.target_price }}</p>
                <p>Status:
                    {% if alert.triggered %}
                        <span class="positive">Triggered ✅</span>
                    {% else %}
                        <span class="negative">Pending ⏳</span>
                    {% endif %}
                </p>
            </div>
        {% endfor %}
        </div>

    </div>

</body>
</html>
